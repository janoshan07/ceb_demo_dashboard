# -------------------------------------------------------------
# OTP Two-Factor Authentication Configuration
# -------------------------------------------------------------
ceb.otp.expiration-seconds=300
ceb.otp.resend-cooldown-seconds=60
ceb.otp.max-attempts=5
ceb.otp.default-fallback-phone=+94771234567

# -------------------------------------------------------------
# SMS Gateway Provider Configuration
# Supported providers: 'mock' (default for local dev/testing), 'twilio'
# Environment variables allow secure zero-code secrets injection.
# -------------------------------------------------------------
ceb.sms.provider=${SMS_PROVIDER:mock}
ceb.sms.mock.log-otp-for-dev=true

# Twilio SMS Configuration (Used when SMS_PROVIDER=twilio)
ceb.sms.twilio.account-sid=${SMS_TWILIO_ACCOUNT_SID:}
ceb.sms.twilio.auth-token=${SMS_TWILIO_AUTH_TOKEN:}
ceb.sms.twilio.from-number=${SMS_TWILIO_FROM_NUMBER:}


